name: YouTube 自動投稿

on:
  schedule:
    # 毎日 18:07 (日本時間)。GitHub の定期実行はまれに遅れたり飛ばされたりするので、
    # 19:37 と 21:07 にも予備で動く(その日にもう投稿していれば何もしない)
    - cron: "7 9 * * *"
    - cron: "37 10 * * *"
    - cron: "7 12 * * *"
  workflow_dispatch:
    inputs:
      index:
        description: "何本目の動画か 0-7 (空欄なら日付で自動)"
        required: false
        type: string
      dry_run:
        description: "アップロードせず動画だけ作る"
        required: false
        type: boolean
        default: false

concurrency:
  group: youtube-post
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 今日もう投稿したか確認
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%F)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          COUNT=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=posted-$TODAY&per_page=1" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['total_count'])")
          if [ "$COUNT" -gt 0 ]; then
            echo "$TODAY はもう投稿済みなので、何もしません。" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - name: ffmpeg とドットフォントをインストール
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-unifont

      - name: Python パッケージをインストール
        if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements-youtube.txt

      - name: 動画を作成して投稿
        if: steps.check.outputs.skip != 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
          INDEX: ${{ inputs.index }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          if [ -n "$INDEX" ]; then ARGS="$ARGS --index $INDEX"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m youtube_bot $ARGS

      # 投稿できたら「今日は投稿済み」の目印を残す(予備の定期実行が二重に投稿しないように)
      - name: 投稿済みの目印を残す
        if: steps.check.outputs.skip != 'true' && inputs.dry_run != true && hashFiles('output/posted.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: posted-${{ steps.check.outputs.today }}
          path: output/posted.txt
          retention-days: 3

      - name: 作成した動画を保存
        if: always() && steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: output/*.mp4
          if-no-files-found: ignore
          retention-days: 7
